services:
  - type: web
    runtime: node
    name: check-work-daily
    repo: https://github.com/bandamchannel-bit/check-work-daily
    branch: main
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_GROUP_ID
        sync: false
      - key: NODE_VERSION
        value: 20
